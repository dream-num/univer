name: Node Setup
description: Node.js setup for CI, including cache configuration

runs:
    using: composite
    steps:
        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
              run_install: false

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version: 24.3.0
              cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile --prefer-offline
          env:
              HUSKY: 0
          shell: bash
