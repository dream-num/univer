name: 🧪 CI Test

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

env:
    TURBO_TELEMETRY_DISABLED: '1'

jobs:
    test:
        if: github.repository == 'dream-num/univer'
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            - name: 🩺 Run test
              run: pnpm coverage

            - name: 🧬 Report coverage
              uses: codecov/codecov-action@v7
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    eslint:
        if: github.repository == 'dream-num/univer'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            - name: Restore ESLint cache
              uses: actions/cache@v6
              with:
                  path: .eslintcache
                  key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'eslint.config.ts') }}-${{ github.sha }}
                  restore-keys: |
                      eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'eslint.config.ts') }}-

            - name: 🌡️ Run ESLint
              run: pnpm lint --quiet --cache --cache-location .eslintcache

    typecheck:
        if: github.repository == 'dream-num/univer'
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            - name: 🧼 Type checking
              run: pnpm typecheck
