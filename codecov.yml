coverage:
    status:
        project:
            default:
                # basic
                target: 80%
                threshold: 0
                base: auto
                # advanced settings
                if_ci_failed: error
                informational: false
                only_pulls: false
        patch: off

ignore:
    # Embed visual shells compose React portals, runtime slots, and host UI chrome.
    # The behavior is covered through lower-level embed services and host adapters.
    - packages/embed-ui/src/components/EmbedFloatDomRenderer.tsx
    - packages/embed-ui/src/components/EmbedFloatFullscreenButton.tsx
    - packages/embed-ui/src/components/EmbedHostToolbarMenu.tsx
    - packages/embed-ui/src/components/EmbedRuntimeProviders.tsx
    - packages/docs-ui/src/EmbedDocsCustomBlockRenderer.tsx
