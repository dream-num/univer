packages:
    - common/*
    - examples
    - mockdata
    - presets
    - presets/packages/*
    - packages/*
    - tests/*
publicHoistPattern:
    - '@storybook/react'
allowBuilds:
    '@parcel/watcher': false
    '@swc/core': false
    esbuild: false
    protobufjs: false
overrides:
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.4
    react: 19.2.8
    react-dom: 19.2.8
minimumReleaseAgeExclude:
    - '@amamo/*'
    - '@univerjs/*'
